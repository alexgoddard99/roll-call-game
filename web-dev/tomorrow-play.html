<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Play Tomorrow — Yea or Nay (dev)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Libre+Franklin:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .dev-banner {
    background: #952722; color: #fff; text-align: center;
    font-family: "Libre Franklin", sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: .2em; text-transform: uppercase; padding: 8px 12px;
  }
</style>
</head>
<body>
<div class="paper-grain" aria-hidden="true"></div>
<div class="dev-banner">Dev preview — playing tomorrow&rsquo;s edition (practice, not recorded)</div>

<header class="masthead">
  <div class="utility-bar">
    <button class="utility-link" id="stats-link">My Record</button>
    <button class="utility-link" id="auth-link" hidden>Sign In</button>
  </div>
  <div class="dateline">
    <span id="dateline-left">…</span>
    <span class="dateline-center">★ ★ ★ ★</span>
    <span id="dateline-right">…</span>
  </div>
  <h1 class="masthead-title">Yea or Nay.</h1>
  <div class="masthead-tagline">
    <span>The Daily Congressional Vote Game</span>
    <span class="tagline-sep">—</span>
    <span>Tomorrow&rsquo;s Edition, Today</span>
  </div>
</header>

<main id="app" aria-live="polite"></main>

<script src="puzzles.js"></script>
<script>
  window.YON_DEV_PREVIEW = true;
  // land on tomorrow's edition automatically
  (function () {
    if (new URLSearchParams(location.search).has("p")) return;
    var fmt = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York" });
    var day = Math.round((Date.parse(fmt.format(new Date(Date.now() + 86400000)))
      - Date.parse(window.ROLLCALL_DATA.epoch)) / 86400000);
    location.replace("tomorrow-play.html?p=" +
      (((day % window.ROLLCALL_DATA.puzzles.length) + window.ROLLCALL_DATA.puzzles.length)
        % window.ROLLCALL_DATA.puzzles.length));
  })();
</script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
